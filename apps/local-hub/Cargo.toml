[package]
name = "nexora-local-hub"
version = "0.1.0"
edition = "2024"
description = "Nexora Local Hub transport and synchronization contract foundation"
license = "UNLICENSED"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
getrandom = "0.2"
mdns-sd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tower = "0.5"
