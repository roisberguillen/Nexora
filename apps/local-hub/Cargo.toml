[package]
name = "nexora-local-hub"
version = "0.1.0"
edition = "2024"
description = "Nexora Local Hub transport and synchronization contract foundation"
license = "UNLICENSED"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
http = "1"
serde_json = "1"
tower = "0.5"
