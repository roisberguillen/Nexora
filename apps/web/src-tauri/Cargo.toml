[package]
name = "nexora"
version = "0.5.0-rc.1"
description = "Nexora personal finance"
authors = ["RG Pictures"]
edition = "2024"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
