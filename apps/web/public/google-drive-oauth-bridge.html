<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collega Google Drive — Nexora</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #10213b;
      }
      button {
        background: #0e3ec7;
        border: 0;
        border-radius: 0.5rem;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 0.75rem 1rem;
      }
      .error {
        color: #a61b1b;
      }
    </style>
  </head>
  <body>
    <h1>Collega Google Drive</h1>
    <p>Nexora richiederà solo l’accesso alla cartella privata dell’app per backup già cifrati.</p>
    <button id="continue" type="button">Continua con Google</button>
    <p id="status" aria-live="polite"></p>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/google-drive-oauth-bridge.js" defer></script>
  </body>
</html>
