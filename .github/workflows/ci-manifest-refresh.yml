name: Refresh project manifest

on:
  push:
    branches: ["codex/ci-gates-2026-10-06"]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh manifest and remove temporary workflow
        run: |
          git rm .github/workflows/ci-manifest-refresh.yml
          pnpm manifest:update
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): refresh project manifest"
          git push origin HEAD:codex/ci-gates-2026-10-06
