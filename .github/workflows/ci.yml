name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm manifest:check
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexora/web build
      - run: cargo check --locked
        working-directory: apps/web/src-tauri
      - run: pnpm --filter @nexora/web tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-desktop-windows
          path: apps/web/src-tauri/target/release/bundle/**
          if-no-files-found: error

  android-arm64-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android build dependencies
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm --filter @nexora/web tauri android init --ci --skip-targets-install
      - run: pnpm --filter @nexora/web tauri android build --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-android-arm64-unsigned
          path: apps/web/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk
          if-no-files-found: error

  android-arm64-signed:
    if: ${{ vars.NEXORA_ANDROID_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android build dependencies
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm --filter @nexora/web tauri android init --ci --skip-targets-install
      - name: Materialize temporary release signing inputs
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEY_BASE64:?ANDROID_KEY_BASE64 is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${ANDROID_STORE_PASSWORD:?ANDROID_STORE_PASSWORD is required}"
          signing_dir="$RUNNER_TEMP/nexora-signing"
          umask 077
          mkdir -m 700 -p "$signing_dir"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$signing_dir/nexora-release.jks"
          test -s "$signing_dir/nexora-release.jks"
          keytool -list -keystore "$signing_dir/nexora-release.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            >/dev/null
          cat > apps/web/src-tauri/gen/android/app/keystore.properties <<EOF
          storeFile=$signing_dir/nexora-release.jks
          keyAlias=$ANDROID_KEY_ALIAS
          EOF
      - name: Configure generated Gradle signing
        run: pnpm android:configure-signing
      - name: Build signed arm64 APK
        env:
          NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEXORA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: pnpm --filter @nexora/web tauri android build --apk --target aarch64 --ci
      - name: Verify and name signed APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          : "${sdk_root:?Android SDK path is required}"
          build_tools_dir="$sdk_root/build-tools/35.0.0"
          apksigner="$build_tools_dir/apksigner"
          zipalign="$build_tools_dir/zipalign"
          test -x "$apksigner"
          test -x "$zipalign"
          mapfile -t release_apks < <(
            find apps/web/src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*-release.apk' ! -name '*-unsigned.apk' -print
          )
          if [ "${#release_apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed release APK, found %s\n' "${#release_apks[@]}" >&2
            printf '%s\n' "${release_apks[@]}" >&2
            exit 1
          fi
          signed_dir="$RUNNER_TEMP/nexora-signed"
          umask 077
          mkdir -m 700 -p "$signed_dir"
          signed_apk="$signed_dir/nexora-android-arm64-release-signed.apk"
          cp -- "${release_apks[0]}" "$signed_apk"
          "$zipalign" -c -v 4 "$signed_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk"
          test -s "$signed_apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-android-arm64-signed
          path: ${{ runner.temp }}/nexora-signed/nexora-android-arm64-release-signed.apk
          if-no-files-found: error
      - name: Remove temporary release signing inputs
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/nexora-signing" "$RUNNER_TEMP/nexora-signed" apps/web/src-tauri/gen/android/app/keystore.properties
