name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm manifest:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test test/e2e/accounts.spec.ts test/e2e/dashboard.spec.ts
          --project=chromium-1440
          --grep "resta coerente con la baseline visuale"
          --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          if-no-files-found: error
          path: |
            test/e2e/accounts.spec.ts-snapshots/accounts-1440-chromium-1440-linux.png
            test/e2e/dashboard.spec.ts-snapshots/dashboard-1440-chromium-1440-linux.png
